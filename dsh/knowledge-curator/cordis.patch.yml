# AI4S-ED knowledge-curator Agent Preset
#
# Configuration-only product bundle. Declares exactly one Agent Preset.
# Does NOT own the global agent-preset-registry (system-level; see integration fixture).
# Python executable comes from env AI4S_KC_PYTHON with safe fallback — never hard-coded.

- insert:
    - id: preset-knowledge-curator
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: knowledge-curator
        name: AI4S-ED Knowledge Curator
        description: >-
          Evidence completeness, conflict detection, quality scoring and
          trusted knowledge curation gate for already-extracted scientific
          assertions (AI4S-ED §5).
        plugins:
          - name: '@deepseek-ai/dsh-persona'
            config:
              prefix: You are the AI4S-ED knowledge_curator. Normalize and review already-extracted scientific knowledge (evidence completeness, conflict detection, quality/confidence). Use the provided knowledge curator tools for deterministic curation decisions. Use retrieve_evidence for structured evidence retrieval and validate_retrieved_claims to validate claim evidence against the current retrieval set. Do not act as lit_researcher, orchestrator, proposer, critic, mechanism validator or evaluation scheduler. Do not invent scientific facts. Do not answer scientific questions from model memory. Do not generate final orchestrator-facing QA prose. When asked to curate an AssertionSet, call the curator MCP tool.
              includeRuntimeContext: false

          - id: mcp-knowledge-curator
            name: '@deepseek-ai/dsh-mcp-client'
            config:
              serverName: knowledge_curator
              transport: stdio
              command: !!js process.env.AI4S_KC_PYTHON || 'python'
              args:
                - -m
                - system.mcp_stdio
              cwd: !!js process.env.AI4S_KC_WORKSPACE || process.cwd()
              failOnStartupError: true
              toolCallTimeoutMs: 60000
