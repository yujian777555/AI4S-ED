name: phase53-r2-verification

on:
  push:
    paths:
      - ".github/workflows/phase53-r2-verification.yml"

jobs:
  knowledge-curator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest anyio mcp pyyaml numpy
      - name: Run knowledge_curator suite
        run: python -m pytest knowledge_curator/tests -q

  integration-dsh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest anyio mcp pyyaml numpy
      - name: Run integration/dsh suite
        run: python -m pytest integration/dsh/tests -q
